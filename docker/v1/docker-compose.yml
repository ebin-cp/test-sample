services:
  mysql:
    build:
      context: ../..
      dockerfile: docker/v1/Dockerfile.mysql
      no_cache: true
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      DB_USER: ${DATABASE_USER}
      DB_USER_PASSWD: ${DATABASE_USER_PASSWORD}
      DB_NAME: ${DATABASE_NAME}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 2048
        hard: 4096
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network
    restart: unless-stopped

  nodejs:
    build:
      context: ../..
      dockerfile: docker/v1/Dockerfile.node
      no_cache: true
    container_name: nodejs_app
    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_USER_PASSWORD: ${DATABASE_USER_PASSWORD}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      NODE_ENV: production
      SOCKET_PORT: 11758
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 2048
        hard: 4096
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: docker/v1/Dockerfile.nginx
      no_cache: true
    container_name: nginx_proxy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 2048
        hard: 4096
    ports:
      - "8883:80"
      - "8884:443"
    depends_on:
      - nodejs
    networks:
      - app_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
