name: Load Test with API validation

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env

          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/measurement-check-test.js
        env:
          WS_MSG_INTERVAL: 1000

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          # 1. ഒരു ടെമ്പററി ഫയൽ ഉണ്ടാക്കി ഓരോ ഡിവൈസിന്റെയും ടോട്ടൽ കൗണ്ട് അതിൽ സേവ് ചെയ്യുന്നു
          echo "" > counts.txt
          for i in {0..49}
          do
            # ഓരോ ഡിവൈസിനും കിട്ടിയ 4 മെട്രിക്സുകളുടെയും ആകെ എണ്ണം കൂട്ടുന്നു
            COUNT=$(jq "[.metrics | to_entries[] | select(.key | contains(\"(Device $i)\")) | .value.values.count] | add" summary.json)
            echo $COUNT >> counts.txt
          done

          # 2. സമാനമായ കൗണ്ടുകൾ ഉള്ള ഡിവൈസുകളെ ഗ്രൂപ്പ് ചെയ്യുന്നു (ഉദാ: 100 data ഉള്ള 30 devices)
          # sort | uniq -c കമാൻഡ് ഉപയോഗിച്ച് ഇത് എളുപ്പത്തിൽ ചെയ്യാം
          GROUPED_REPORT=$(sort -n counts.txt | uniq -c | awk '{print "| " $1 " Devices | " $2 " Data Points per device |"}')

          # 3. ഡാറ്റാബേസ് റോകളുടെ കണക്ക്
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))
          ACTUAL_ROWS=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;" || echo "0")

          # 4. GitHub Summary റിപ്പോർട്ട് തയ്യാറാക്കുന്നു
          echo "### 📊 Data Distribution Report" >> $GITHUB_STEP_SUMMARY
          echo "ഈ റിപ്പോർട്ട് ഓരോ ഡിവൈസിനും എത്ര ഡാറ്റ ലഭിച്ചു എന്ന് കാണിക്കുന്നു:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| No. of Devices | Data Count per Device |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "$GROUPED_REPORT" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗄️ Database Consistency Check" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Messages Sent | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected Rows in DB | $EXPECTED_ROWS |" >> $GITHUB_STEP_SUMMARY
          echo "| Actual Rows in DB | $ACTUAL_ROWS |" >> $GITHUB_STEP_SUMMARY

          # 5. കണ്ടീഷൻ: ഡാറ്റയിൽ കാര്യമായ വ്യത്യാസം ഉണ്ടെങ്കിൽ വിക്കറി അറിയിക്കാം
          # ഉദാഹരണത്തിന് ACTUAL_ROWS പ്രതീക്ഷിച്ചതിലും കുറവാണെങ്കിൽ ജോബ് ഫെയിൽ ആക്കാം
          if [[ "$ACTUAL_ROWS" -lt "$EXPECTED_ROWS" ]]; then
            echo "::error::Data Mismatch! Total DB rows ($ACTUAL_ROWS) is less than expected ($EXPECTED_ROWS)."
            exit 1
          fi