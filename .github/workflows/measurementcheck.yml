name: Load Test with API validation

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env

          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/measurement-check-test.js
        env:
          WS_MSG_INTERVAL: 1000

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          DB_PASS: "${{secrets.DB_ROOT_PASSWD}}"
          DB_NAME: "${{secrets.DB_NAME}}"
        run: |
          # 1. Fetch total device count from Database
          TOTAL_DEVICES=$(docker exec mysql mysql -u root -p${{env.DB_PASS}} -N -s -e "SELECT COUNT(*) FROM ${{env.DB_NAME}}.device;" 2>/dev/null || echo "50")

          # 2. Calculate total measurement count for each device
          echo "" > counts.txt
          LIMIT=$((TOTAL_DEVICES - 1))
          for i in $(seq 0 $LIMIT)
          do
            COUNT=$(jq "[.metrics | to_entries[] | select(.key | contains(\"(Device $i)\")) | .value.values.count // 0] | add" summary.json)
            echo $COUNT >> counts.txt
          done

          # 3. Group devices with similar data counts
          GROUPED_REPORT=$(sort -n counts.txt | uniq -c | awk '{print "| " $1 " Devices | " $2 " Data Points per device |"}')

          # 4. Database row consistency check
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))
          ACTUAL_ROWS=$(docker exec mysql mysql -u root -p${{env.DB_PASS}} -N -s -e "SELECT COUNT(*) FROM ${{env.DB_NAME}}.device_monitor_log;" || echo "0")

          # 5. Generate GitHub Job Summary Report
          echo "### 📊 Data Distribution Report" >> $GITHUB_STEP_SUMMARY
          echo "This report shows the distribution of data points received per device:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| No. of Devices | Data Count per Device |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "$GROUPED_REPORT" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗄️ Database Consistency Check" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Messages Sent | $WS_SENT | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected Rows in DB | $EXPECTED_ROWS | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Actual Rows in DB | $ACTUAL_ROWS | $([[ $ACTUAL_ROWS -ge $EXPECTED_ROWS ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY

          # 6. Exit logic based on data integrity
          if [[ "$ACTUAL_ROWS" -lt "$EXPECTED_ROWS" ]]; then
            echo "::error::Data Mismatch! Expected $EXPECTED_ROWS, found $ACTUAL_ROWS."
            exit 1
          fi