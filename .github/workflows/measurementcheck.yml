name: Load Test with API validation

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env

          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/measurement-check-test.js
        env:
          WS_MSG_INTERVAL: 1000

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          # 1. അടിസ്ഥാന കണക്കുകൾ
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))
          ACTUAL_ROWS=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;" || echo "0")
          DEVICE_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device;" 2>/dev/null || echo "0")

          # 2. എത്ര ഡിവൈസുകൾ പാസ്സായി എന്ന് കണ്ടുപിടിക്കുന്നു
          # ഓരോ ഡിവൈസിനും 4 ചെക്കുകൾ വീതം പാസ്സായോ എന്ന് നോക്കുന്നു
          PASSED_DEVICES=0
          FAILED_DEVICES=0

          for i in {0..49}
          do
            # ആ പ്രത്യേക ഡിവൈസിന്റെ (Device i) 4 മെട്രിക്സുകളിലും കൂടി ഉള്ള ആകെ പരാജയങ്ങൾ എണ്ണുന്നു
            # jq ഇവിടുത്തെ 'checks' എന്ന കീ സ്കാൻ ചെയ്ത് Device i ഉള്ളവ മാത്രം എടുക്കും
            DEVICE_FAILS=$(jq "[.metrics | to_entries[] | select(.key | contains(\"(Device $i)\")) | .value.values.fails] | add" summary.json)

            if [[ "$DEVICE_FAILS" -eq 0 ]]; then
              PASSED_DEVICES=$((PASSED_DEVICES + 1))
            else
              FAILED_DEVICES=$((FAILED_DEVICES + 1))
            fi
          done

          # 3. GitHub Summary Table
          echo "### 📊 Measurement Check Validation" >> $GITHUB_STEP_SUMMARY
          echo "| Total No of Devices | No of devices with all 4 measurements | No of devices missing measurements |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| $DEVICE_COUNT | $PASSED_DEVICES ✅ | $FAILED_DEVICES $([[ $FAILED_DEVICES -gt 0 ]] && echo "❌" || echo "✅") |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗄️ Database Record Count" >> $GITHUB_STEP_SUMMARY
          echo "| Expected Rows | Actual Rows | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| $EXPECTED_ROWS | $ACTUAL_ROWS | $([[ $ACTUAL_ROWS -ge $EXPECTED_ROWS ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY

          # 4. പരാജയപ്പെട്ടാൽ ജോബ് ഫെയിൽ ആക്കുക
          TOTAL_API_FAILS=$(jq '.metrics.checks.values.fails // 0' summary.json)
          if [[ "$FAILED_DEVICES" -gt 0 || "$ACTUAL_ROWS" -lt "$EXPECTED_ROWS" ]]; then
            echo "::error::Validation Failed! $FAILED_DEVICES devices are missing data or DB rows mismatch."
            exit 1
          fi