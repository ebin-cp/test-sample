name: Load Test with API validation

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env

          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/measurement-check-test.js
        env:
          WS_MSG_INTERVAL: 1000

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          MYSQL_PWD: "${{ secrets.DB_ROOT_PASSWD }}"
          DB_NAME: "${{ secrets.DB_NAME }}"
        run: |
          DEVICES=$(docker exec -e MYSQL_PWD=$MYSQL_PWD mysql mysql -u root -N -s -e "SELECT imei FROM $DB_NAME.device;" 2>/dev/null)
          RETRIEVED_DEVICES=$(echo "$DEVICES" | wc -l)

          echo "" > individual_report.txt
          DEVICE_IDX=0
          DEVICES_WITH_4_TYPES=0

          while read -r imei; do
            if [ -z "$imei" ]; then continue; fi
            
            TOTAL_MEAS=$(docker exec -e MYSQL_PWD=$MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM $DB_NAME.device_monitor_log WHERE device_imei='$imei';" 2>/dev/null || echo "0")
            
            UNIQUE_TYPES=$(docker exec -e MYSQL_PWD=$MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(DISTINCT measurement_type) FROM $DB_NAME.device_monitor_log WHERE device_imei='$imei';" 2>/dev/null || echo "0")
            
            if [ "$UNIQUE_TYPES" -eq 4 ]; then
              DEVICES_WITH_4_TYPES=$((DEVICES_WITH_4_TYPES + 1))
            fi

            echo "| Device $DEVICE_IDX | $UNIQUE_TYPES | $TOTAL_MEAS |" >> individual_report.txt
            DEVICE_IDX=$((DEVICE_IDX + 1))
          done <<< "$DEVICES"

          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))
          ACTUAL_ROWS=$(docker exec -e MYSQL_PWD=$MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM $DB_NAME.device_monitor_log;" 2>/dev/null || echo "0")

          echo "### 📊 Data Distribution Report" >> $GITHUB_STEP_SUMMARY
          echo "| Description | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| No. of devices retrieved | $RETRIEVED_DEVICES |" >> $GITHUB_STEP_SUMMARY
          echo "| No. of devices with 4 measurements | $DEVICES_WITH_4_TYPES |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗄️ Database Consistency Check" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected Total Rows (Sum of all devices) | $EXPECTED_ROWS | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Total measurements in DB | $ACTUAL_ROWS | $([[ "$ACTUAL_ROWS" -ge "$EXPECTED_ROWS" ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Individual Device Metrics" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to view measurements for each of the $RETRIEVED_DEVICES devices</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Device ID | Measurement Types | Total Individual Measurements |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          cat individual_report.txt >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          if [ "$ACTUAL_ROWS" -lt "$EXPECTED_ROWS" ]; then
            echo "::error::Data Mismatch! Expected $EXPECTED_ROWS, found $ACTUAL_ROWS."
            exit 1
          fi