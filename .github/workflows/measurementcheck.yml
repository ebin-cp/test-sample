name: Load Test with API validation

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env

          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/measurement-check-test.js
        env:
          WS_MSG_INTERVAL: 1000

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Unified Validation
        if: always()
        env:
          DB_PASS: "${{ secrets.DB_ROOT_PASSWD }}"
          DB_NAME: "${{ secrets.DB_NAME }}"
        run: |
          # 1. Fetch baseline metrics from k6 and Database
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          TOTAL_DB_LOGS=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log;" 2>/dev/null || echo "0")
          
          # 2. Initialize Report Headers in GitHub Step Summary
          echo "# 🏁 Final Test Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "Cross-verification between API (k6 teardown) and Database (MySQL)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 3. Overall Test Statistics Table
          echo "### 📊 Overall Statistics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Source |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Messages Sent | $WS_SENT | k6 Metrics |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Logs in Database | $TOTAL_DB_LOGS | MySQL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 4. Detailed Per-Device Consistency Check (k6 vs DB)
          echo "### 📱 Per-Device Consistency Check" >> $GITHUB_STEP_SUMMARY
          echo "| IMEI | API Count (k6) | DB Count (SQL) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          # Extract the IMEI list from the k6 teardown results
          IMEI_LIST=$(jq -r '.teardown.results[].imei' summary.json)

          for id in $IMEI_LIST; do
            # Extract the message count recorded by k6 for this specific IMEI
            K6_COUNT=$(jq -r ".teardown.results[] | select(.imei==\"$id\") | .total" summary.json)
            
            # Query the database for the actual number of logs for this specific IMEI
            DB_COUNT=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s \
              -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log WHERE imei = '$id';" 2>/dev/null || echo "0")
            
            # Compare counts and determine the status
            if [ "$K6_COUNT" -eq "$DB_COUNT" ]; then
              STATUS="✅ Match"
            else
              STATUS="❌ Mismatch"
            fi

            echo "| $id | $K6_COUNT | $DB_COUNT | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Verification Note:** API counts are retrieved via k6 teardown HTTP GET requests, while DB counts are queried directly from the MySQL container." >> $GITHUB_STEP_SUMMARY