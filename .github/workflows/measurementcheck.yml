name: Load Test with API validation

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env

          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/measurement-check-test.js
        env:
          WS_MSG_INTERVAL: 1000

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          TOTAL_DEVICES=$(jq '.metrics.keys_count.values.count // 50' summary.json) # അല്ലെങ്കിൽ നേരിട്ട് 50 എന്ന് നൽകാം
                    
          PASSED_DEVICES=0
          FAILED_DEVICES=0

          for i in {0..49}
          do
            DEVICE_FAILS=$(jq "[.metrics[] | select(.name | contains(\"(Device $i)\")) | .fails] | add" summary.json)
            
            if [[ "$DEVICE_FAILS" -eq 0 ]]; then
              PASSED_DEVICES=$((PASSED_DEVICES + 1))
            else
              FAILED_DEVICES=$((FAILED_DEVICES + 1))
            fi
          done

          # 3. GitHub Summary Table
          echo "### 📊 Measurement Check Validation" >> $GITHUB_STEP_SUMMARY
          echo "| Total No of Devices | No of devices with all 4 measurements | No of devices missing measurements |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| $TOTAL_DEVICES | $PASSED_DEVICES ✅ | $FAILED_DEVICES $([[ $FAILED_DEVICES -gt 0 ]] && echo "❌" || echo "✅") |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Detailed per-device data is available in the raw \`summary.json\` artifact." >> $GITHUB_STEP_SUMMARY

          if [[ "$FAILED_DEVICES" -gt 0 ]]; then
            echo "::error::Some devices are missing measurements!"
            exit 1
          fi