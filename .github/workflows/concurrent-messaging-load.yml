name: 50-Device Load Test and API Verification

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          # Ensure the .env is in the docker directory for Compose to find
          cp .env docker/v1/.env
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/load-test.js
        env:
          WS_MSG_INTERVAL: 300

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          # 1. Extract Metrics from k6 Summary
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          API_FAILS=$(jq '.metrics.checks.values.fails // 0' summary.json)
          API_PASSES=$(jq '.metrics.checks.values.passes // 0' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))
          
          # Scrape the API retrieval counts from k6 logs
          API_DEVICES_RETRIEVED=$(grep "\[RESULT_DEVICES\]" k6_output.log | sed 's/.*: //' | awk '{print $1}' || echo "0")

          # 2. Extract Data from MySQL
          ACTUAL_ROWS=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;" || echo "0")
          DEVICE_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device;" 2>/dev/null || \
                         docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.devices;" 2>/dev/null || echo "0")

          # 3. Generate GitHub Job Summary
          echo "### Load Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | DB Actual | API Retrieved |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "|  Devices | $DEVICE_COUNT | $API_DEVICES_RETRIEVED |" >> $GITHUB_STEP_SUMMARY
          echo "|  WS Messages | $WS_SENT | - |" >> $GITHUB_STEP_SUMMARY
          echo "|  Rows (4x) | $ACTUAL_ROWS / $EXPECTED_ROWS | - |" >> $GITHUB_STEP_SUMMARY
          
          echo -e "\n### API Verification" >> $GITHUB_STEP_SUMMARY
          echo "* **Total Successful Checks:** $API_PASSES / 3" >> $GITHUB_STEP_SUMMARY

          # 4. "Soft Fail" Logic (Print warnings instead of exiting)
          if [[ "$ACTUAL_ROWS" -lt "$EXPECTED_ROWS" ]]; then
            echo "::warning title=Data Discrepancy::Expected $EXPECTED_ROWS rows, but only found $ACTUAL_ROWS. Test continued anyway."
          fi

          if [[ "$API_FAILS" -gt 0 ]]; then
            echo "::warning title=API Validation Warning::$API_FAILS checks failed during teardown. Test continued anyway."
          fi

          echo "Validation complete. Results are posted to the Summary tab."