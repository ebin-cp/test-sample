name: 50-Device Load Test and API Verification
on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          # Ensure .env is in the same folder as the compose file
          cp .env docker/v1/.env 
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/load-test.js
        env:
          # WE REMOVED THE MATRIX AND SET THIS MANUALLY HERE
          WS_MSG_INTERVAL: 300

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          # 1. Extract Metrics from k6 Summary
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          API_FAILS=$(jq '.metrics.checks.values.fails // 0' summary.json)
          API_PASSES=$(jq '.metrics.checks.values.passes // 0' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))

          # 2. Extract Data from MySQL
          ACTUAL_ROWS=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;")
          DEVICE_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device;")

          # 3. Print to Console for quick debugging
          echo "=========================================="
          echo "      LOAD TEST VALIDATION REPORT         "
          echo "=========================================="
          echo "Devices Registered: $DEVICE_COUNT"
          echo "WS Messages Sent:   $WS_SENT"
          echo "Expected Log Rows:  $EXPECTED_ROWS"
          echo "Actual Log Rows:    $ACTUAL_ROWS"
          echo "API Checks Failed:  $API_FAILS"
          echo "=========================================="

          # 4. Generate GitHub Job Summary (Visible on the UI)
          echo "###  Load Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "|  Devices in DB | $DEVICE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "|  WS Messages Sent | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "|  Rows Expected | $EXPECTED_ROWS |" >> $GITHUB_STEP_SUMMARY
          echo "|  Rows Actual | $ACTUAL_ROWS |" >> $GITHUB_STEP_SUMMARY
          echo "|  API Checks Passed | $API_PASSES |" >> $GITHUB_STEP_SUMMARY
          echo "|  API Checks Failed | $API_FAILS |" >> $GITHUB_STEP_SUMMARY

          # 5. Logical Gates (Failing the build)
          if [ "$DEVICE_COUNT" -lt 50 ]; then
            echo "::error::Device registration incomplete ($DEVICE_COUNT/50)."
            exit 1
          fi

          if [ "$ACTUAL_ROWS" -lt "$EXPECTED_ROWS" ]; then
            echo "::error::Data Loss Detected! Expected $EXPECTED_ROWS, got $ACTUAL_ROWS."
            exit 1
          fi

          if [ "$API_FAILS" -gt 0 ]; then
            echo "::error::API Retrieval Verification failed ($API_FAILS errors)."
            exit 1
          fi

          echo " All validations passed successfully!"