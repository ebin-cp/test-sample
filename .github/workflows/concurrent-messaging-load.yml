name: 50-Device Concurrent WebSocket Messaging stress test
on: [push]

jobs:
  load-test-with-docker:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [300]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DB_PORT }}" >> .env
          mv .env docker/v1/

      - name: Start Services
        run: docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Services to be Ready
        run: |
          echo "Waiting for API and Database to initialize..."
          sleep 40
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8883/health || (docker compose -f ./docker/v1/docker-compose.yml logs && exit 1)

      - name: Setup Grafana K6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/load-test.js --summary-mode full
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Generate Verification Report
        if: always()
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          # Extract k6 metrics
          K6_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          LIST_VAL=$(jq '.metrics.device_list_passes.values.count // 0' summary.json)
          DATA_VAL=$(jq '.metrics.log_validation_passes.values.count // 0' summary.json)
          
          # Extract DB metrics
          DB_DEVICES=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.devices;")
          DB_LOGS=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;")

          echo "=========================================="
          echo "         LOAD TEST FINAL REPORT           "
          echo "=========================================="
          echo "Devices (DB):              $DB_DEVICES / 50"
          echo "k6 WS Packets Sent:        $K6_SENT"
          echo "Total Logs Found (DB):     $DB_LOGS"
          echo "List Verification Passes:  $LIST_VAL / 50"
          echo "Data Content Passes:       $DATA_VAL / 50"
          echo "=========================================="

          # Final Integrity Logic: 1 k6 packet = 4 DB rows
          EXPECTED_LOGS=$(( K6_SENT * 4 ))
          
          if [ "$DB_DEVICES" -lt 50 ]; then
            echo "::error::Registration Failure: Only $DB_DEVICES devices found in DB."
            exit 1
          fi

          if [ "$DB_LOGS" -lt "$EXPECTED_LOGS" ]; then
            echo "::error::Data Loss Detected! Expected $EXPECTED_LOGS rows but found $DB_LOGS."
            exit 1
          fi

          if [ "$LIST_VAL" -lt 50 ] || [ "$DATA_VAL" -lt 50 ]; then
            echo "::error::API Validation failed for one or more devices."
            exit 1
          fi

      - name: Stop Services
        if: always()
        run: docker compose -f ./docker/v1/docker-compose.yml down -v