name: 50-Device Load Test and API Verification
on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          # Ensure .env is in the same folder as the compose file
          cp .env docker/v1/.env 
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/load-test.js
        env:
          # WE REMOVED THE MATRIX AND SET THIS MANUALLY HERE
          WS_MSG_INTERVAL: 300

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          # 1. DB Row Check
          ROW_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;")
          
          # 2. k6 Metrics extraction from the local summary.json
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count' summary.json)
          API_FAILS=$(jq '.metrics.checks.values.fails' summary.json)
          EXPECTED_ROWS=$(( WS_SENT * 4 ))

          echo "Validation Report:"
          echo "WS Messages Sent: $WS_SENT"
          echo "Expected Rows: $EXPECTED_ROWS"
          echo "Actual Rows in DB: $ROW_COUNT"
          echo "API Failures: $API_FAILS"

          if [ "$ROW_COUNT" -lt "$EXPECTED_ROWS" ]; then
            echo "::error::Data integrity check failed! Missing rows in MySQL."
            exit 1
          fi

          if [ "$API_FAILS" -gt 0 ]; then
            echo "::error::API Verification Failed! Teardown checks did not pass."
            exit 1
          fi