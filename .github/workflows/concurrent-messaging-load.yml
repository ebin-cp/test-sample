name: 50-Device Concurrent Load Test (Optimized)
on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  load-test-with-docker:
    runs-on: ubuntu-latest
    environment: load_test  
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [300, 400, 500] 

    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          echo "DATABASE_PORT=3306" >> .env
          mv .env docker/v1/

      - name: Start Services
        run: docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Services to be Ready
        run: |
          sleep 25
          curl --retry 5 --retry-connrefused http://localhost:8883/health

      - name: Setup Grafana K6
        uses: grafana/setup-k6-action@v1

      - name: Execute k6 Test
        id: k6test
        # കൗണ്ട് കുറവാണെങ്കിലും ടെസ്റ്റ് നിന്നുപോകാതിരിക്കാൻ ഇത് സഹായിക്കും
        continue-on-error: true 
        run: k6 run tests/load-test.js --summary-export=summary.json
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Validate API and Log Integrity
        if: always() # ടെസ്റ്റ് എറർ ആയാലും ഇത് റൺ ആകും
        run: |
          if [ -f summary.json ]; then
            CHECK_RATE=$(jq '.metrics.checks.values.rate' summary.json)
            echo "API Validation Pass Rate: $CHECK_RATE"
          else
            echo "Summary file not found. Test might have crashed."
            exit 1
          fi

      - name: Database Row Count Check (Final Verification)
        if: always() # ഡാറ്റാബേസ് കണക്ക് നിർബന്ധമായും കാണിക്കും
        env:
          MYSQL_PWD: "${{ secrets.DB_ROOT_PASSWD }}"
        run: |
          ROW_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{ secrets.DB_NAME }}.device_monitor_log;")
          echo "------------------------------------------"
          echo "FINAL RESULT: Total logs stored in MySQL: $ROW_COUNT"
          echo "------------------------------------------"

      - name: Stop and Cleanup
        if: always()
        run: docker compose -f ./docker/v1/docker-compose.yml down -v
