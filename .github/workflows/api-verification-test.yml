name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [300]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          DEVICES=$(jq -r '.metrics.devices_found_count.values.value // 0' summary.json)
          CONNS=$(jq -r '.metrics.connections_success_count.values.value // 0' summary.json)
          PASS_COUNT=$(jq -r '.metrics.integrity_passed_count.values.value // 0' summary.json)
          TOTAL_VOL=$(jq -r '.metrics.total_saved_count.values.value // 0' summary.json)
          
          echo "### 📊 API Verification & Integrity Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Actual | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device Retrieval** | 50 | $DEVICES | $([[ $DEVICES -eq 50 ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Endpoint Connectivity** | 50 | $CONNS | $([[ $CONNS -eq 50 ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Verified Devices (No Loss)** | 50 | $PASS_COUNT | $([[ $PASS_COUNT -eq 50 ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Volume Records** | - | $TOTAL_VOL | 📈 |" >> $GITHUB_STEP_SUMMARY

          # Failure Logic
          if [[ "$DEVICES" -ne 50 ]]; then
            echo "::error::Retrieval Failed: API did not return all 50 devices."
            exit 1
          fi

          if [[ "$PASS_COUNT" -lt 50 ]]; then
            echo "::error::Integrity Failed: One or more devices are empty or missing data points."
            exit 1
          fi
          
          echo "Success: All created devices verified in MySQL with expected data counts."
