name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [300]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          echo "===== API Verification Report ====="

          # Device Retrieval Check
          DEVICES=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/api/v1/device)
          DEVICE_LIST=$(curl -s -H "Authorization: ${DEVICES}" http://localhost:8883/api/v1/device)
          RETRIEVED_COUNT=$(echo "$DEVICE_LIST" | jq '. | length // 0')
          echo "Device Retrieval Status: $DEVICES"
          echo "Devices Retrieved: $RETRIEVED_COUNT"

          # k6 Metrics for Connections
          CONNS=$(jq -r '.metrics.connections_success_count.values.value // 0' summary.json)
          echo "Device Measurement Connections Established: $CONNS"

          # Data Integrity - informational only
          echo "===== DB Data Integrity Check ====="
          sleep 5
          echo "Per-device rows in DB:"
          docker exec -i -e MYSQL_PWD="${{ secrets.DB_ROOT_PASSWD }}" mysql \
            mysql -uroot -D "${{ secrets.DB_NAME }}" \
            -e "SELECT imei, COUNT(*) as cnt FROM device_monitor_log GROUP BY imei ORDER BY imei;" \
            > per_device_rows.txt

          cat per_device_rows.txt

          # Optional: show total sent messages from k6 summary
          WS_SENT=$(jq -r '.metrics.total_sent_count.values.value // 0' summary.json)
          echo "Total Messages Sent (from k6): $WS_SENT"
          TOTAL_ROWS=$(docker exec -i -e MYSQL_PWD="${{ secrets.DB_ROOT_PASSWD }}" mysql \
            mysql -uroot -D "${{ secrets.DB_NAME }}" \
            -e "SELECT COUNT(*) FROM device_monitor_log;" -s -N)
          echo "Total Rows in device_monitor_log: $TOTAL_ROWS"

          # GitHub Summary Table
          echo "### 🔍 API Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Expected | Actual |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Devices Retrieved | 50 | $RETRIEVED_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Device Connections | 50 | $CONNS |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Messages Sent (k6) | - | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Rows in DB | - | $TOTAL_ROWS |" >> $GITHUB_STEP_SUMMARY
          echo "| Per-device row counts | - | see per_device_rows.txt |" >> $GITHUB_STEP_SUMMARY

          # Fail CI only if device retrieval or connection failed
          FAIL=false
          if [[ "$RETRIEVED_COUNT" -lt 50 ]]; then
            echo "::error::Only $RETRIEVED_COUNT devices retrieved (expected 50)"
            FAIL=true
          fi
          if [[ "$CONNS" -lt 50 ]]; then
            echo "::error::Only $CONNS device connections established (expected 50)"
            FAIL=true
          fi
          if [[ "$FAIL" == "true" ]]; then
            exit 1
          fi
