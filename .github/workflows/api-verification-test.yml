name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      matrix:
        WS_MSG_INTERVAL: [300, 400, 500]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          # 1. Extract failure counts using a robust contains filter
          # This looks for the check name inside the checks metric
          DEVICE_LIST_FAIL=$(jq '.metrics.checks.values.fails // 0' summary.json)
          
          # Since you have multiple checks, we want to ensure we catch ANY failure in the checks group
          TOTAL_CHECK_FAILS=$(jq '.metrics.checks.values.fails' summary.json)
          TOTAL_CHECK_PASSES=$(jq '.metrics.checks.values.passes' summary.json)

          # 2. Specifically check if "Has Data" passed
          # We look at the 'passes' vs 'fails' for that specific logic
          echo "=========================================="
          echo "      API VALIDATION REPORT               "
          echo "=========================================="
          echo "Total Successful Checks: $TOTAL_CHECK_PASSES"
          echo "Total Failed Checks:     $TOTAL_CHECK_FAILS"
          echo "=========================================="

          # 3. Generate the GitHub UI Summary
          echo "### API Test Results (Interval: ${{ matrix.WS_MSG_INTERVAL }}ms)" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL_CHECK_FAILS" -eq "0" ] && [ "$TOTAL_CHECK_PASSES" -gt 0 ]; then
            echo "**ALL CHECKS PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**SOME CHECKS FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "Review the 'Capture Logs' section or download artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed Checks | $TOTAL_CHECK_PASSES |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed Checks | $TOTAL_CHECK_FAILS |" >> $GITHUB_STEP_SUMMARY

          # 4. CRITICAL: Exit with error if there are ANY failures
          if [ "$TOTAL_CHECK_FAILS" -gt 0 ]; then
            echo "::error::API Validation Failed! One or more checks (like 'Has Data') failed."
            exit 1
          fi
