name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [300]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Audit Report
        if: always()
        run: |
          # 1. Extract variables from the summary generated by k6
          # We use jq to pull the custom metrics we defined in the k6 script
          RETRIEVED=$(jq -r '.metrics.devices_found_count.values.value // 0' summary.json)
          CONNS=$(jq -r '.metrics.connections_success_count.values.value // 0' summary.json)
          WS_SENT=$(jq -r '.metrics.total_sent_msgs.values.count // 0' summary.json)
          DB_TOTAL=$(jq -r '.metrics.total_saved_count.values.value // 0' summary.json)

          echo "## 📊 DEVICE AUDIT SUMMARY" >> $GITHUB_STEP_SUMMARY
          
          echo "### 1. Connectivity & Retrieval Status" >> $GITHUB_STEP_SUMMARY
          echo "| Check Type | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # Check Device Retrieval List
          if [ "$RETRIEVED" -eq 50 ]; then
            echo "| Device Retrieval (GET /api/v1/device) | 50/50 | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Device Retrieval (GET /api/v1/device) | $RETRIEVED/50 | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check Individual Endpoint Connections
          if [ "$CONNS" -eq 50 ]; then
            echo "| Individual Endpoint Connections | 50/50 | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Individual Endpoint Connections | $CONNS/50 | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY

          echo "### 2. Data Integrity (SQL Style Audit)" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Total Rows Expected = (Total Sent × 4 metrics per bundle)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total WebSocket Bundles Sent** | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Rows Expected in DB** | $(( WS_SENT * 4 )) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Rows Found in DB** | $DB_TOTAL |" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY

          echo "### 3. Individual Device Data Count List" >> $GITHUB_STEP_SUMMARY
          echo "*Check k6 console logs for the full list of 50 individual IMEI counts.*" >> $GITHUB_STEP_SUMMARY
          
          # Logic: Fail the build if core connectivity or retrieval is broken
          if [[ "$RETRIEVED" -ne 50 || "$CONNS" -ne 50 ]]; then
            echo "::error::Audit Failed: Retrieval or Connectivity did not reach 50/50."
            exit 1
          fi