name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [300]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation - MySQL Data Check
        if: always()
        run: |
          echo "===== DB Data Integrity Check ====="

          # Expected values from k6
          EXPECTED_PER_DEVICE=200
          DEVICE_COUNT=50
          EXPECTED_TOTAL=$((EXPECTED_PER_DEVICE * DEVICE_COUNT))

          # Total rows in device_monitor_log
          ROW_COUNT=$(docker exec -i mysql \
            mysql -uroot -p"$DB_ROOT_PASSWD" -D "$DB_NAME" \
            -e "SELECT COUNT(*) FROM device_monitor_log;" -s -N)

          echo "Total Rows in device_monitor_log: $ROW_COUNT"

          # Per-device rows
          docker exec -i mysql \
            mysql -uroot -p"$DB_ROOT_PASSWD" -D "$DB_NAME" \
            -e "SELECT imei, COUNT(*) as cnt FROM device_monitor_log GROUP BY imei ORDER BY imei;" \
            > per_device_rows.txt

          echo "Per-device row counts:"
          cat per_device_rows.txt

          # CI summary table
          echo "### 🔍 API Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Expected | Actual | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Devices | $DEVICE_COUNT | $DEVICE_COUNT | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Data Sent | $EXPECTED_TOTAL | $ROW_COUNT | $([[ "$ROW_COUNT" -eq "$EXPECTED_TOTAL" ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY

          # Fail logic
          FAIL=false
          if [[ "$ROW_COUNT" -ne "$EXPECTED_TOTAL" ]]; then
            echo "::error::Data mismatch! Sent=$EXPECTED_TOTAL Received=$ROW_COUNT"
            FAIL=true
          fi

          # Optional: warn per device
          while read IMEI COUNT; do
            if [[ "$COUNT" -lt "$EXPECTED_PER_DEVICE" ]]; then
              echo "::warning::Device $IMEI has only $COUNT rows (expected $EXPECTED_PER_DEVICE)"
            fi
          done < per_device_rows.txt

          if [[ "$FAIL" == "true" ]]; then
            exit 1
          fi
