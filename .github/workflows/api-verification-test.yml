name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      matrix:
        WS_MSG_INTERVAL: [100, 200, 300, 400, 500]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          # Extract counts from summary.json
          ACTUAL_DEVICES=$(jq '.metrics["checks{name:API: Device List Count Match}"].values.passes // 0' summary.json)
          SUCCESS_ENDPOINTS=$(jq '.metrics["checks{name:API: All Endpoints 200}"].values.passes // 0' summary.json)
          DEVICES_WITH_DATA=$(jq '.metrics["checks{name:API: All Devices Have Data}"].values.passes // 0' summary.json)
          
          # Since the checks above return 1 (for pass) or 0 (for fail), 
          # we look at the console logs captured in the previous step for the raw numbers,
          # or we can pull custom metrics if you added them. 
          
          echo "### Deep Trace Validation (Interval: ${{ matrix.WS_MSG_INTERVAL }}ms)" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device Retrieval** | Found $ACTUAL_DEVICES of 50 | $([[ $ACTUAL_DEVICES -eq 1 ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Endpoint Health** | $SUCCESS_ENDPOINTS of 50 Respond 200 | $([[ $SUCCESS_ENDPOINTS -eq 1 ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Data Integrity** | $DEVICES_WITH_DATA of 50 have DB records | $([[ $DEVICES_WITH_DATA -eq 1 ]] && echo "✅" || echo "❌") |" >> $GITHUB_STEP_SUMMARY

          # Fail if any check is 0 (meaning the '100% pass' check failed)
          if [[ "$ACTUAL_DEVICES" -eq 0 || "$SUCCESS_ENDPOINTS" -eq 0 || "$DEVICES_WITH_DATA" -eq 0 ]]; then
            echo "::error::Validation Failed! Not all 50 devices verified correctly."
            exit 1
          fi
