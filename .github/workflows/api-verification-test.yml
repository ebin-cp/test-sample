name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      matrix:
        WS_MSG_INTERVAL: [300, 400, 500]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-verification-test.js
        env:
          WS_MSG_INTERVAL: ${{matrix.WS_MSG_INTERVAL}}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          # 1. Function to extract 'fails' for a specific check name
          get_fail_count() {
            # This jq command searches for the check by name and returns its fail count
            jq --arg NAME "$1" '.metrics.checks.thresholds[]? | select(.name == $NAME) | .fails // 0' summary.json
          }

          # 2. Extract specific counts
          DEVICE_LIST_FAIL=$(get_fail_count "API: Device List 200")
          MEAS_API_FAIL=$(get_fail_count "API: Measurements 200")
          MEAS_DATA_FAIL=$(get_fail_count "API: Measurements Has Data")

          # 3. Helper function for Emojis
          status_icon() {
            if [[ "$1" -eq 0 ]]; then echo "✅ Passed"; else echo "❌ Failed"; fi
          }

          # 4. Generate GitHub Job Summary Table
          echo "### API Validation Details (Interval: ${{ matrix.WS_MSG_INTERVAL }}ms)" >> $GITHUB_STEP_SUMMARY
          echo "| Verification Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Device List Retrieval | $(status_icon $DEVICE_LIST_FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| Measurements Endpoint | $(status_icon $MEAS_API_FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Integrity (Has Records) | $(status_icon $MEAS_DATA_FAIL) |" >> $GITHUB_STEP_SUMMARY

          # 5. Console Output for Debugging
          echo "Device List Failures: $DEVICE_LIST_FAIL"
          echo "Meas API Failures: $MEAS_API_FAIL"
          echo "Data Storage Failures: $MEAS_DATA_FAIL"

          # 6. Final Exit Logic (Fail if any variable is > 0)
          if [[ "$DEVICE_LIST_FAIL" -gt 0 || "$MEAS_API_FAIL" -gt 0 || "$MEAS_DATA_FAIL" -gt 0 ]]; then
            echo "::error::API Verification Failed. Check the summary table for details."
            exit 1
          fi
