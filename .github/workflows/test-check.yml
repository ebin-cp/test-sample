name: 50-Device API Verification sample test check

on: [push]

jobs:
  device-verification:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start Docker services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Run Device Verification Test
        run: k6 run tests/test-check.js --summary-export=summary.json

      - name: Append Test & DB Metrics to GitHub Summary
        run: |
          echo "## K6 Test Summary" >> $GITHUB_STEP_SUMMARY
          jq -r '.metrics | to_entries[] | "### \(.key)\nPasses: \(.value.passes // 0)\nFails: \(.value.fails // 0)"' summary.json >> $GITHUB_STEP_SUMMARY

          echo "## Database Metrics" >> $GITHUB_STEP_SUMMARY
          
          # Total devices
          DEVICE_COUNT=$(docker exec -i mysql \
            mysql -u root -p"${{ secrets.DB_ROOT_PASSWD }}" -N -s -e "SELECT COUNT(*) FROM ${{ secrets.DB_NAME }}.devices;")
          echo "- Total devices in DB: $DEVICE_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Total measurements
          TOTAL_MEASUREMENTS=$(docker exec -i mysql \
            mysql -u root -p"${{ secrets.DB_ROOT_PASSWD }}" -N -s -e "SELECT COUNT(*) FROM ${{ secrets.DB_NAME }}.device_monitor_log;")
          echo "- Total measurements in DB: $TOTAL_MEASUREMENTS" >> $GITHUB_STEP_SUMMARY
          
          # Per-device measurement counts
          echo "### Per-device counts:" >> $GITHUB_STEP_SUMMARY
          docker exec -i mysql \
            mysql -u root -p"${{ secrets.DB_ROOT_PASSWD }}" -N -s -e "SELECT imei, COUNT(*) FROM ${{ secrets.DB_NAME }}.device_monitor_log GROUP BY imei;" \
            | while read imei count; do
                echo "- $imei: $count" >> $GITHUB_STEP_SUMMARY
            done

      - name: Stop Docker Services
        if: always()
        run: docker compose -f ./docker/v1/docker-compose.yml down -v
