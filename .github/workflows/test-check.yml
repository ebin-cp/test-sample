name: IoT Device Integration Test

on: [push, workflow_dispatch]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Environment
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=localhost" >> .env
          echo "DATABASE_PORT=3306" >> .env
          mkdir -p docker/v1/
          mv .env docker/v1/
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for API
        run: sleep 20 && curl -s http://localhost:8883/health || echo "API starting..."

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Concurrent Test
        id: run_k6
        shell: bash
        run: |
          # Increase system limits for concurrent WebSockets
          ulimit -n 4096
          
          # Check if file exists before running to avoid 107/127 errors
          if [ ! -f tests/test-check.js ]; then
            echo "Error: tests/test-check.js not found!"
            ls -R tests/
            exit 1
          fi

          # Run k6. We use --quiet to keep the log file clean for parsing
          k6 run tests/test-check.js --quiet > test_output.log 2>&1 || true

      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
          
          # Check for WebSocket Errors
          if grep -q "WS_ERROR" test_output.log; then
            echo "### ⚠️ Connection Errors Found" >> $GITHUB_STEP_SUMMARY
            grep "WS_ERROR" test_output.log >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📱 Device Creation" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Is Empty | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          grep "DEVICE_CHECK" test_output.log | awk -F'|' '{print "| "$2" | "$3" | "$4" |"}' | sed 's/Status://;s/Empty://;s/Count://' >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Measurement Counts" >> $GITHUB_STEP_SUMMARY
          echo "| IMEI | API Status | Count (60 Expected) |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          grep "MEASURE_CHECK" test_output.log | awk -F'|' '{print "| "$2" | "$3" | "$4" |"}' >> $GITHUB_STEP_SUMMARY