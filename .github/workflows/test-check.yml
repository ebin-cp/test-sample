name: 50-Device Concurrent WebSocket Messaging stress test
on:
  push:
    branches:
      # - main
  workflow_dispatch:

jobs:
  load-test-with-docker:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [10000]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DB_PORT }}" >> .env
          mv .env docker/v1/

      - name: Start Services
        run: docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Services to be Ready
        run: |
          sleep 10 
          curl --retry 5 --retry-connrefused http://localhost:8883/health

      - name: Setup Grafana K6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/check-test.js --summary-mode full
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Get Devices Count
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          docker exec -e MYSQL_PWD mysql mysql \
            -u root \
            -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.devices;"

      - name: Extract k6 WS Messages Sent
        id: k6_stats
        run: |
          WS_SENT=$(jq '.metrics.ws_msgs_sent.values.count' summary.json)
          echo "WS_SENT=$WS_SENT" >> $GITHUB_ENV
          echo "$WS_SENT messages sent using k6"

      - name: Get Log Messages Count
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          ROW_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;"| awk '{print $1}')
          echo "ROW_COUNT=$ROW_COUNT" >> $GITHUB_ENV
          echo "$ROW_COUNT rows found in database."

      - name: Compare and Validate
        run: |
          if [[ -z "$WS_SENT" || -z "$ROW_COUNT" ]]; then
            echo "::error::Metrics missing. K6: $WS_SENT, DB: $ROW_COUNT"
            exit 1
          fi

          EXPECTED_ROWS=$(( WS_SENT * 4 ))

          echo "K6 Messages Sent: $WS_SENT"
          echo "Expected Rows ($WS_SENT * 4): $EXPECTED_ROWS"
          echo "Actual Rows in MySQL: $ROW_COUNT"

          if [ "$ROW_COUNT" -ne "$EXPECTED_ROWS" ]; then
            echo "::error::Data integrity check failed! Expected $EXPECTED_ROWS rows but found $ROW_COUNT."
            exit 1
          else
            echo "Success: Data counts match."
          fi

      - name: Audit Report
        if: always()
        run: |
          # 1. Extract variables from the summary generated by k6
          # We use jq to pull the custom metrics we defined in the k6 script
          RETRIEVED=$(jq -r '.metrics.devices_found_count.values.value // 0' summary.json)
          CONNS=$(jq -r '.metrics.connections_success_count.values.value // 0' summary.json)
          WS_SENT=$(jq -r '.metrics.total_sent_msgs.values.count // 0' summary.json)
          DB_TOTAL=$(jq -r '.metrics.total_saved_count.values.value // 0' summary.json)

          echo "## 📊 DEVICE AUDIT SUMMARY" >> $GITHUB_STEP_SUMMARY
          
          echo "### 1. Connectivity & Retrieval Status" >> $GITHUB_STEP_SUMMARY
          echo "| Check Type | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # Check Device Retrieval List
          if [ "$RETRIEVED" -eq 50 ]; then
            echo "| Device Retrieval (GET /api/v1/device) | 50/50 | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Device Retrieval (GET /api/v1/device) | $RETRIEVED/50 | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check Individual Endpoint Connections
          if [ "$CONNS" -eq 50 ]; then
            echo "| Individual Endpoint Connections | 50/50 | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Individual Endpoint Connections | $CONNS/50 | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY

          echo "### 2. Data Integrity (SQL Style Audit)" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Total Rows Expected = (Total Sent × 4 metrics per bundle)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total WebSocket Bundles Sent** | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Rows Expected in DB** | $(( WS_SENT * 4 )) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Rows Found in DB** | $DB_TOTAL |" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY

          echo "### 3. Individual Device Data Count List" >> $GITHUB_STEP_SUMMARY
          echo "*Check k6 console logs for the full list of 50 individual IMEI counts.*" >> $GITHUB_STEP_SUMMARY
          
          # Logic: Fail the build if core connectivity or retrieval is broken
          if [[ "$RETRIEVED" -ne 50 || "$CONNS" -ne 50 ]]; then
            echo "::error::Audit Failed: Retrieval or Connectivity did not reach 50/50."
            exit 1
          fi


      - name: Stop Services
        if: always()
        run: docker compose -f ./docker/v1/docker-compose.yml down -v
