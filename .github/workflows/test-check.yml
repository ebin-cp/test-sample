name: API Verification Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-verification:
    runs-on: ubuntu-latest
    environment: load_test
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [10000] # 10 seconds
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file and start services
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=mysql" >> .env
          cp .env docker/v1/.env  
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do sleep 5; done'

      - name: Execute Test (via Docker)
        run: |
          # Running via Docker ensures the k6 binary is found and shares the host network
          docker run --rm \
            --network host \
            -v $(pwd):/io \
            -e WS_MSG_INTERVAL=${{ matrix.WS_MSG_INTERVAL }} \
            grafana/k6:latest run /io/tests/test-check.js --summary-export=/io/summary.json

      - name: Direct Database Audit (SQL)
        if: always()
        run: |
          echo "### 🗄️ SQL Database Truth" >> $GITHUB_STEP_SUMMARY
          
          echo "#### Total Row Count" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          docker exec mysql mysql -u root -p${{ secrets.DB_ROOT_PASSWD }} ${{ secrets.DB_NAME }} \
            -e "SELECT COUNT(*) AS total_rows FROM device_monitor_log;" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "#### Individual Device Breakdown" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          docker exec mysql mysql -u root -p${{ secrets.DB_ROOT_PASSWD }} ${{ secrets.DB_NAME }} \
            -e "SELECT imei, COUNT(*) AS count FROM device_monitor_log GROUP BY imei ORDER BY count DESC;" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          DB_ACTUAL_TOTAL=$(docker exec mysql mysql -u root -p${{ secrets.DB_ROOT_PASSWD }} ${{ secrets.DB_NAME }} -sN -e "SELECT COUNT(*) FROM device_monitor_log;")
          echo "DB_ACTUAL_TOTAL=$DB_ACTUAL_TOTAL" >> $GITHUB_ENV

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1 || true
          docker logs mysql > mysql_logs.txt 2>&1 || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-results-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Audit Report
        if: always()
        run: |
          if [ ! -f summary.json ]; then
            echo "## ❌ TEST CRITICAL FAILURE" >> $GITHUB_STEP_SUMMARY
            echo "k6 failed to generate summary.json." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          RETRIEVED=$(jq -r '.metrics.devices_found_count.values.value // 0' summary.json)
          WS_SENT=$(jq -r '.metrics.total_sent_msgs.values.count // 0' summary.json)
          API_TOTAL=$(jq -r '.metrics.total_saved_count.values.value // 0' summary.json)
          
          SQL_TOTAL=${{ env.DB_ACTUAL_TOTAL }}
          EXPECTED=$(( WS_SENT * 4 ))

          echo "## 📊 DATA INTEGRITY RECONCILIATION" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Expected | Actual (SQL) | Actual (API) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Devices** | 50 | 50 | $RETRIEVED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Rows** | $EXPECTED | $SQL_TOTAL | $API_TOTAL |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$RETRIEVED" -ne 50 || "$SQL_TOTAL" -lt "$EXPECTED" ]]; then
            echo "::error::Audit Failed: Mismatch between sent and stored data."
            exit 1
          fi