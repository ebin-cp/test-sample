name: IoT Device Integration Test

on: [push, workflow_dispatch]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Environment
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=localhost" >> .env
          echo "DATABASE_PORT=3306" >> .env
          mkdir -p docker/v1/
          mv .env docker/v1/
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for API
        run: sleep 20 && curl -s http://localhost:8883/health || echo "API starting..."

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Concurrent Test
        shell: bash
        run: |
          ulimit -n 4096
          # We use --logformat raw to make parsing easier
          k6 run tests/test-check.js --logformat raw > test_output.log 2>&1 || true
          
          # Debug: Print logs to the GH console so you can see if they exist
          echo "--- START OF K6 LOG ---"
          cat test_output.log
          echo "--- END OF K6 LOG ---"

      - name: Get Devices Count
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          docker exec -e MYSQL_PWD mysql mysql \
            -u root \
            -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.devices;"

      - name: Extract k6 WS Messages Sent
        id: k6_stats
        run: |
          WS_SENT=$(jq '.metrics.ws_msgs_sent.values.count' summary.json)
          echo "WS_SENT=$WS_SENT" >> $GITHUB_ENV
          echo "$WS_SENT messages sent using k6"

      - name: Get Log Messages Count
        env:
          MYSQL_PWD: "${{secrets.DB_ROOT_PASSWD}}"
        run: |
          ROW_COUNT=$(docker exec -e MYSQL_PWD mysql mysql -u root -N -s -e "SELECT COUNT(*) FROM ${{secrets.DB_NAME}}.device_monitor_log;"| awk '{print $1}')
          echo "ROW_COUNT=$ROW_COUNT" >> $GITHUB_ENV
          echo "$ROW_COUNT rows found in database."

      - name: Compare and Validate
        run: |
          if [[ -z "$WS_SENT" || -z "$ROW_COUNT" ]]; then
            echo "::error::Metrics missing. K6: $WS_SENT, DB: $ROW_COUNT"
            exit 1
          fi

          EXPECTED_ROWS=$(( WS_SENT * 4 ))

          echo "K6 Messages Sent: $WS_SENT"
          echo "Expected Rows ($WS_SENT * 4): $EXPECTED_ROWS"
          echo "Actual Rows in MySQL: $ROW_COUNT"

          if [ "$ROW_COUNT" -ne "$EXPECTED_ROWS" ]; then
            echo "::error::Data integrity check failed! Expected $EXPECTED_ROWS rows but found $ROW_COUNT."
            exit 1
          else
            echo "Success: Data counts match."
          fi

      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📱 Device Creation" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Is Empty | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          # Improved Parsing
          grep "DEV_CHECK_MARKER" test_output.log | awk -F'|' '{print "| "$2" | "$3" | "$4" |"}' >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Measurement Counts" >> $GITHUB_STEP_SUMMARY
          echo "| IMEI | API Status | Count (60 Expected) |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          grep "MEASURE_CHECK_MARKER" test_output.log | awk -F'|' '{print "| "$2" | "$3" | "$4" |"}' >> $GITHUB_STEP_SUMMARY