name: IoT Device Integration Test

on: [push, workflow_dispatch]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Environment
        run: |
          echo "DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_HOST=localhost" >> .env
          echo "DATABASE_PORT=3306" >> .env
          mkdir -p docker/v1/
          mv .env docker/v1/
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for API
        run: sleep 20 && curl -s http://localhost:8883/health || echo "API starting..."

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Concurrent Test
        id: run_k6
        shell: bash
        run: |
          k6 run tests/test-check.js > test_output.log 2>&1

      - name: Generate GitHub Summary
        if: always()
        run: |
          echo "## 📊 Concurrent Test Report" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📱 Device Registration Status" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Is Empty | Device Count |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          grep "DEVICE_CHECK" test_output.log | awk -F'|' '{print "| "$2" | "$3" | "$4" |"}' | sed 's/Status://;s/Empty://;s/Count://' >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Measurement Verification (API vs DB)" >> $GITHUB_STEP_SUMMARY
          echo "| IMEI | API Status | API Count | MySQL DB Count |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          
          grep "MEASURE_CHECK" test_output.log | while read -r line; do
            IMEI=$(echo $line | cut -d'|' -f2)
            STATUS=$(echo $line | cut -d'|' -f3)
            API_COUNT=$(echo $line | cut -d'|' -f4)
            
            # Direct MySQL count to verify persistence
            DB_COUNT=$(docker exec $(docker ps -qf name=mysql) mysql -u${{ secrets.DB_USER }} -p${{ secrets.DB_USER_PASSWD }} ${{ secrets.DB_NAME }} -N -s -e "SELECT COUNT(*) FROM device_monitor_log WHERE IMEI='$IMEI';")
            
            echo "| $IMEI | $STATUS | $API_COUNT | $DB_COUNT |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Stop Environment
        if: always()
        run: docker compose -f ./docker/v1/docker-compose.yml down