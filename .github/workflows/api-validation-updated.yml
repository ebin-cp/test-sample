name: API data validation updated K6 and DB test

on: 
  push:
    branches:
    - main
    workflow_dispatch:

jobs:
  api-data-validation-updated-test:
    runs-on: ubuntu-latest
    environment: api-validation
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [1000]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          DATABASE_USER=${{ secrets.DB_USER }}
          DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}
          DATABASE_HOST=mysql
          DATABASE_PORT=3306
          EOF
          cp .env docker/v1/.env          
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Execute Test
        shell: bash
        run: |
          # Use --summary-export and ignore k6 failure to proceed to validation
          k6 run tests/api-validation-test-updated.js --summary-export=summary.json || true
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        id: k6_run
        continue-on-error: true # Prevents crash if thresholds fail
        run: k6 run tests/api-validation-test-updated.js --summary-export=summary.json
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          DB_PASS: ${{ secrets.DB_ROOT_PASSWD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # Check if k6 actually produced a summary
          if [ ! -f summary.json ]; then
            echo "### ❌ Error: k6 summary.json was not generated." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 1. Extract Overall Metrics
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          METRICS_PER_MSG=4
          TOTAL_EXPECTED=$((WS_SENT * METRICS_PER_MSG))
          
          # 2. Query Database
          TOTAL_DB_LOGS=$(docker exec mysql mysql -u root -p${DB_PASS} -N -s -e "SELECT COUNT(*) FROM ${DB_NAME}.device_monitor_log;" 2>/dev/null || echo "0")
          TOTAL_DEVICES=$(jq '[.root_group.checks[] | select(.name | contains("Total Messages Count"))] | length' summary.json)
          
          # 3. Individual Consistency Logic
          # Extract the count from Device 0 check (assuming it's representative)
          EXPECTED_PER_DEVICE=$(jq -r '.root_group.checks[] | select(.name | contains("Total Messages Count for Device 0:")) | .name' summary.json | grep -oP '\d+$' | head -n 1 || echo "0")
          
          MATCH_COUNT=0
          for i in $(seq 0 $((TOTAL_DEVICES - 1))); do
            K6_VAL=$(jq -r --arg idx "$i" '.root_group.checks[] | select(.name | contains("Total Messages Count for Device \($idx):")) | .name' summary.json | grep -oP '\d+$' | head -n 1 || echo "0")
            if [ "$K6_VAL" -ne "0" ] && [ "$K6_VAL" -eq "$EXPECTED_PER_DEVICE" ]; then
              MATCH_COUNT=$((MATCH_COUNT+1))
            fi
          done

          # 4. Generate the Report
          echo "### Final Test Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "#### Overall Statistics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Messages Sent (Expected) | $WS_SENT * $METRICS_PER_MSG = $TOTAL_EXPECTED |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Devices Retrieved | $TOTAL_DEVICES |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Logs in Database (Received) | $TOTAL_DB_LOGS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Consistent Data Streams (Matched)" >> $GITHUB_STEP_SUMMARY
          echo "* **Matched Devices:** $MATCH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "* Individual measurement count received: **$EXPECTED_PER_DEVICE** measurements per device in both K6 and DB." >> $GITHUB_STEP_SUMMARY
          
          if [ "$MATCH_COUNT" -eq "$TOTAL_DEVICES" ] && [ "$TOTAL_EXPECTED" -eq "$TOTAL_DB_LOGS" ] && [ "$TOTAL_EXPECTED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All devices matched perfectly!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Integrity Gap Detected!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi