name: API data validation updated K6 and DB test

on: 
  push:
    branches:
    - main
    workflow_dispatch:

jobs:
  api-data-validation-updated-test:
    runs-on: ubuntu-latest
    environment: api-validation
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [1000]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          DATABASE_USER=${{ secrets.DB_USER }}
          DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}
          DATABASE_HOST=mysql
          DATABASE_PORT=3306
          EOF
          cp .env docker/v1/.env          
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Execute Test
        shell: bash
        run: |
          # Use --summary-export and ignore k6 failure to proceed to validation
          k6 run tests/api-validation-test-updated.js --summary-export=summary.json || true
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        id: k6_run
        continue-on-error: true # Prevents crash if thresholds fail
        run: k6 run tests/api-validation-test-updated.js --summary-export=summary.json
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          DB_PASS: ${{ secrets.DB_ROOT_PASSWD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # Check if k6 actually produced a summary
          if [ ! -f summary.json ]; then
            echo "### ❌ Error: k6 summary.json was not generated." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 1. Extract Overall Metrics
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          METRICS_PER_MSG=4
          TOTAL_EXPECTED=$((WS_SENT * METRICS_PER_MSG))
          
          # 2. Query Database
          TOTAL_DB_LOGS=$(docker exec mysql mysql -u root -p${DB_PASS} -N -s -e "SELECT COUNT(*) FROM ${DB_NAME}.device_monitor_log;" 2>/dev/null || echo "0")
          TOTAL_DEVICES=$(jq '[.root_group.checks[] | select(.name | contains("Total Messages Count"))] | length' summary.json)
          
          # 3. Individual Consistency Logic
          for id in $IMEI_LIST; do
            K6_COUNT=$(jq -r --arg idx "$INDEX" '.root_group.groups[].checks[] | select(.name | contains("Total Messages Count for Device \($idx):")) | .name' summary.json | head -n 1 | grep -oP '\d+$' || echo "0")
            DB_COUNT=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log WHERE imei = '$id';" 2>/dev/null || echo "0")
  
            K6_VAL=${K6_COUNT:-0}
            DB_VAL=${DB_COUNT:-0}
  
            if [ "$K6_VAL" -eq "$EXPECTED_COUNT" ] && [ "$DB_VAL" -eq "$EXPECTED_COUNT" ]; then
              MATCH_COUNT=$((MATCH_COUNT+1))
            else
              MISMATCH_COUNT=$((MISMATCH_COUNT+1))
              echo "$K6_VAL $DB_VAL" >> mismatches.txt
            fi
            INDEX=$((INDEX+1))
          done
  
          # 4. Consistency Summary Section
          echo "#### **Consistent Data Streams** (Matched)" >> $GITHUB_STEP_SUMMARY
          echo "* **Matched Devices:** $MATCH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "* Individual measurement count received: **$EXPECTED_COUNT** measurements per device in both K6 and DB." >> $GITHUB_STEP_SUMMARY
          
          if [ "$MISMATCH_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### **Measurement Integrity Gaps** (Mismatched)" >> $GITHUB_STEP_SUMMARY
            echo "* **Mismatched Devices:** $MISMATCH_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "* **Received total individual count:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| API Count (k6) | DB Count (SQL) | No. of Devices |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            sort mismatches.txt | sed '/^\s*$/d' | uniq -c | sort -nr | while read count k6 db; do
              echo "| $k6 | $db | $count |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**All devices matched perfectly!**" >> $GITHUB_STEP_SUMMARY
          fi