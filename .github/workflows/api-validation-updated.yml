name: API data validation updated K6 and DB test

on: 
  push:
    branches:
    - main
    workflow_dispatch:

jobs:
  api-data-validation-updated-test:
    runs-on: ubuntu-latest
    environment: api-validation
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [1000]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          DATABASE_USER=${{ secrets.DB_USER }}
          DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}
          DATABASE_HOST=mysql
          DATABASE_PORT=3306
          EOF
          cp .env docker/v1/.env          
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for Services to settle..."
          sleep 15 
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do echo "Still waiting..."; sleep 5; done'
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-validation-test-updated.js
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        run: |
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json)
          TOTAL_DB_LOGS=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log;" 2>/dev/null || echo "0")
          
          METRICS_PER_MSG=4
          TOTAL_EXPECTED=$((WS_SENT * METRICS_PER_MSG))
          
          echo "### Final Test Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Batches Sent | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected Total Data Points ($WS_SENT * $METRICS_PER_MSG) | $TOTAL_EXPECTED |" >> $GITHUB_STEP_SUMMARY
          echo "| Actual Data Points in DB | $TOTAL_DB_LOGS |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$TOTAL_EXPECTED" -eq "$TOTAL_DB_LOGS" ]; then
            echo "✅ **All data points successfully stored!**" >> $GITHUB_STEP_SUMMARY
          else
            DIFF=$((TOTAL_EXPECTED - TOTAL_DB_LOGS))
            echo "❌ **Data Loss Detected! Missing $DIFF points.**" >> $GITHUB_STEP_SUMMARY
          fi