name: API data validation updated K6 and DB test

on: 
  push:
    branches:
    - main
    workflow_dispatch:

jobs:
  api-data-validation-updated-test:
    runs-on: ubuntu-latest
    environment: api-validation
    strategy:
      fail-fast: false
      matrix:
        WS_MSG_INTERVAL: [1000]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          DATABASE_USER=${{ secrets.DB_USER }}
          DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}
          DATABASE_HOST=mysql
          DATABASE_PORT=3306
          EOF
          cp .env docker/v1/.env          
          docker compose -f ./docker/v1/docker-compose.yml up -d

      - name: Wait for Health Check
        run: |
          echo "Waiting for Services to settle..."
          sleep 15 
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "200" ] || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8883/health)" == "403" ]; do echo "Still waiting..."; sleep 5; done'
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        run: k6 run tests/api-validation-test-updated.js
        env:
          WS_MSG_INTERVAL: ${{ matrix.WS_MSG_INTERVAL }}

      - name: Capture Logs for Artifacts
        if: always()
        run: |
          docker logs nodejs_app > app_logs.txt 2>&1
          docker logs mysql > mysql_logs.txt 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-test-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            app_logs.txt
            mysql_logs.txt

      - name: Final Validation
        if: always()
        env:
          DB_PASS: "${{secrets.DB_ROOT_PASSWD}}"
          DB_NAME: "${{secrets.DB_NAME}}"
        run: |
          set +e 

          # 1. Fetch baseline metrics safely
          WS_SENT=$(jq '.metrics.ws_metrics_sent_msgs.values.count // 0' summary.json || echo "0")
          TOTAL_DB_LOGS=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log;" 2>/dev/null || echo "0")
          
          echo "### Final Test Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Messages Sent | $WS_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Logs in Database | $TOTAL_DB_LOGS |" >> $GITHUB_STEP_SUMMARY

          # 2. Extract counts and handle empty results
          ALL_COUNTS=$(jq -r '.root_group.checks[] | select(.name | contains("Total Messages Count")) | .name' summary.json 2>/dev/null | grep -oP '\d+$')          
          if [ -z "$ALL_COUNTS" ]; then
            echo "⚠️ No k6 checks found in summary.json" >> $GITHUB_STEP_SUMMARY
          else
            EXPECTED_COUNT=$(echo "$ALL_COUNTS" | sort | uniq -c | sort -nr | head -n 1 | awk '{print $2}')
            echo "| Expected per device | $EXPECTED_COUNT |" >> $GITHUB_STEP_SUMMARY            
            if [ "$WS_SENT" -gt 0 ] && [ "$TOTAL_DB_LOGS" -ge "$WS_SENT" ]; then
               echo "✅ **Data Integrity: Success**" >> $GITHUB_STEP_SUMMARY
            else
               echo "❌ **Data Integrity: Mismatch Detected**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          exit 0