name: API & WS Test Framework

on: 
  push:
    branches: [ feat/api-ws-tests ]
  workflow_dispatch:

jobs:
  k6-validation:
    runs-on: ubuntu-latest
    env:
        WS_MSG_INTERVAL: 1000
        WS_MSG_DURATION: 60000
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Services
        run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          DATABASE_USER=${{ secrets.DB_USER }}
          DATABASE_USER_PASSWORD=${{ secrets.DB_USER_PASSWD }}
          DATABASE_HOST=mysql
          DATABASE_PORT=3306
          EOF
          mkdir -p docker/v1
          cp .env docker/v1/.env          
          docker compose -f ./docker/v1/docker-compose.yml up -d
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Test
        id: k6_run
        continue-on-error: true 
        run: k6 run api-main-test.js --summary-export=../../summary.json --console-output=../../k6_output.log
        working-directory: ./tests/src
        env:
          WS_MSG_INTERVAL: ${{ env.WS_MSG_INTERVAL }}

      - name: Final DB & API Validation
        if: always()
        env:
          DB_PASS: "${{secrets.DB_ROOT_PASSWD}}"
          DB_NAME: "${{secrets.DB_NAME}}"
        run: |
          
          if [ ! -f summary.json ]; then echo "Summary missing"; exit 1; fi
          
          # --- 1. Extract API Metrics from summary.json ---
          ASSIGN_OK=$(jq -r '.root_group.checks["Assign Status 200"].passes // 0' summary.json)
          DEASSIGN_OK=$(jq -r '.root_group.checks["Deassign Status 200"].passes // 0' summary.json)
          
          # --- 2. Extract Measurement & DB Metrics ---
          WS_SENT_COUNT=$(jq -r '.metrics.ws_metrics_sent_msgs.count // 0' summary.json)
          TOTAL_DEVICES=$(docker exec mysql mysql -u root -p${{env.DB_PASS}} -N -s -e "SELECT COUNT(*) FROM ${{env.DB_NAME}}.devices;" 2>/dev/null || echo "0")
          TOTAL_DB_LOGS=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log;" 2>/dev/null || echo "0")
          
          # Same measurement logic as before
          EXPECTED_TOTAL_LOGS=$((WS_SENT_COUNT * 4))
          if [ "$TOTAL_DEVICES" -gt 0 ]; then
             EXPECTED_PER_DEVICE=$((EXPECTED_TOTAL_LOGS / TOTAL_DEVICES))
          else
             EXPECTED_PER_DEVICE=0
          fi

          # --- 3. Generate GitHub Step Summary Report ---
          
          echo "| Resource | Created | Expected |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Devices | $TOTAL_DEVICES | 50 |" >> $GITHUB_STEP_SUMMARY
          echo "#### **API Actions Report**" >> $GITHUB_STEP_SUMMARY
          echo "| Action Type | Success Count | Expected |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Truck Assignment | $ASSIGN_OK | 50 |" >> $GITHUB_STEP_SUMMARY
          echo "| Truck De-assignment | $DEASSIGN_OK | 50 |" >> $GITHUB_STEP_SUMMARY
          
          CALIB_OK=$(jq '.metrics.calibration_sync_total.values.count // 0' summary.json)
          TARGET_VUS=50

          echo "### Calibration Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Result | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$CALIB_OK" -ge "$TARGET_VUS" ]; then
            echo "| Calibration Sync | $CALIB_OK | $TARGET_VUS | PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Calibration Sync | $CALIB_OK | $TARGET_VUS | FAIL |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "#### **Measurement & DB Consistency**" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Total WS Messages Sent | $WS_SENT_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Total DB Logs (Received) | $TOTAL_DB_LOGS |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected Logs Per Device | $EXPECTED_PER_DEVICE |" >> $GITHUB_STEP_SUMMARY
          
          # --- 4. Consistency Per-Device Logic (Your existing loop) ---
          MATCH_COUNT=0
          MISMATCH_COUNT=0
          touch mismatches.txt
          IMEI_LIST=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT imei FROM ${{env.DB_NAME}}.devices;")
          
          for id in $IMEI_LIST; do
            DB_COUNT=$(docker exec mysql mysql -u root -p${{ env.DB_PASS }} -N -s -e "SELECT COUNT(*) FROM ${{ env.DB_NAME }}.device_monitor_log WHERE imei = '$id';" 2>/dev/null || echo "0")
            if [ "$DB_COUNT" -eq "$EXPECTED_PER_DEVICE" ] && [ "$EXPECTED_PER_DEVICE" -ne 0 ]; then
              MATCH_COUNT=$((MATCH_COUNT+1))
            else
              MISMATCH_COUNT=$((MISMATCH_COUNT+1))
              echo "IMEI:$id Expected:$EXPECTED_PER_DEVICE DB:$DB_COUNT" >> mismatches.txt
            fi
          done

          if [ "$MISMATCH_COUNT" -eq 0 ] && [ "$TOTAL_DB_LOGS" -eq "$EXPECTED_TOTAL_LOGS" ] && [ "$TOTAL_DB_LOGS" -gt 0 ]; then
            echo "> **SUCCESS:** All data streams are consistent. Every device has exactly $EXPECTED_PER_DEVICE logs." >> $GITHUB_STEP_SUMMARY
          else
            echo "> **FAILED:** Data inconsistency detected! Matched: $MATCH_COUNT, Mismatched: $MISMATCH_COUNT" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.WS_MSG_INTERVAL }}
          path: |
            summary.json
            mismatches.txt
            k6_output.log         